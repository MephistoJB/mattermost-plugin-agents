server:
  transport: http
  host: 0.0.0.0
  port: 8000

llm:
  provider: openai
  model: ${MODEL_NAME}
  max_tokens: 4096
  structured_output_mode: ${LLM_STRUCTURED_OUTPUT_MODE:json_schema}
  providers:
    openai:
      api_key: ${OPENAI_API_KEY}
      api_url: ${OPENAI_API_URL}

embedder:
  provider: openai
  model: ${EMBEDDER_MODEL}
  dimensions: ${EMBEDDING_DIM:768}
  providers:
    openai:
      api_key: ${OPENAI_API_KEY}
      api_url: ${OPENAI_API_URL}

database:
  provider: falkordb
  providers:
    falkordb:
      uri: ${FALKORDB_URI}
      password: ${FALKORDB_PASSWORD:}
      database: ${FALKORDB_DATABASE}

graphiti:
  group_id: ${GRAPHITI_GROUP_ID}
  user_id: memory_service
